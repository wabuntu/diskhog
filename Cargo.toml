[package]
name = "diskhog"
version = "0.1.0"
authors = ["wabuntu <to.wabuntu@proton.me>"]
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/wabuntu"
repository = "https://github.com/wabuntu/diskhog"
documentation = "https://docs.rs/diskhog"
description = """
TUI that lists the largest files on disk and moves the ones you pick
to the trash, with size and %-of-disk shown for each.
"""

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
walkdir = "2.5.0"
trash = "5.2.6"
fs4 = "1.1.0"
